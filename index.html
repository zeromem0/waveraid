<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wave Raid</title>
<meta name="theme-color" content="#000000">
<style>
  :root { --bg: #000; --fg: #ccc; --muted: #888; --line: #444; --bar: #333; --barText: #fff; --accent: #ff0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); overflow: hidden; touch-action: none;
         font: 13px/1.4 "Cascadia Mono", Consolas, "Roboto Mono", "Noto Sans Mono", monospace;
         -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
         gap: 10px; padding: 8px 16px; }
  #stage { display: flex; align-items: center; justify-content: center; gap: 18px; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block;
           outline: 1px solid var(--line); outline-offset: 0; }
  #bottom { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: center;
            color: var(--muted); max-width: 960px; }
  #bottom b { color: var(--fg); font-weight: normal; }
  select, button.small { font: inherit; color: var(--barText); background: var(--bar); border: 1px solid var(--line);
            border-radius: 4px; padding: 3px 8px; }
  label { cursor: pointer; }
  /* the pads, for touch screens */
  .pad { display: none; }
  body.touch .pad { display: flex; }
  body.touch #keys { display: none; }
  #stick { width: 132px; height: 132px; border-radius: 50%; border: 2px solid var(--line); position: relative;
           background: color-mix(in srgb, var(--bar) 55%, transparent); }
  #stick i { position: absolute; width: 0; height: 0; border: 9px solid transparent; }
  #stick .u { left: 57px; top: 8px; border-bottom-color: var(--muted); }
  #stick .d { left: 57px; bottom: 8px; border-top-color: var(--muted); }
  #stick .l { top: 57px; left: 8px; border-right-color: var(--muted); }
  #stick .r { top: 57px; right: 8px; border-left-color: var(--muted); }
  #stick .u.on { border-bottom-color: var(--accent); } #stick .d.on { border-top-color: var(--accent); }
  #stick .l.on { border-right-color: var(--accent); } #stick .r.on { border-left-color: var(--accent); }
  #knob { position: absolute; left: 46px; top: 46px; width: 40px; height: 40px; border-radius: 50%;
          background: var(--muted); opacity: .55; pointer-events: none; }
  #btns { display: grid; grid-template-columns: 64px 64px; gap: 10px; }
  #btns div { height: 56px; border-radius: 12px; border: 2px solid var(--line); background: var(--bar);
              color: var(--barText); display: flex; align-items: center; justify-content: center;
              font-weight: bold; letter-spacing: .5px; }
  #btns div.big { height: 64px; border-radius: 50%; }
  #btns div.on { background: var(--accent); color: var(--bg); }
  #btns .fire { border-color: var(--accent); }
  /* a phone held upright: the picture on top, the pads under it */
  body.port #stage { flex-direction: column; gap: 14px; }
  body.port .pads { display: flex; width: 100%; justify-content: space-between; align-items: center; }
  body:not(.port) .pads { display: contents; }
  body.port #padL { order: 0; } body.port #padR { order: 1; }
  #padL { order: -1; } #padR { order: 1; }
</style>
</head>

// -- one frame ----------------------------------------------------------

    if (!e.on) continue;
    const cx = e.ground ? e.x - g.scroll : e.x;
    const r = 2 + ((e.age * e.size / 18) | 0);
    const c = (e.age & 2) ? T.err : T.mark;
    for (let dx = -r; dx <= r; dx++) {
      const m = r - Math.abs(dx);
      for (let dy = -m; dy <= m; dy++) if (Math.abs(dx) + Math.abs(dy) >= r - 3 || e.age < 6) put(cx + dx, e.y + dy, c);
    }
  }
  if (showShip) sprite(SHIP, g.px >> 4, g.py >> 4);
}

// the built-in 5x7 font of the instrument's screen library
function text(s, x, y, fg, bg) {
  for (const ch of s) {
    const o = (ch.charCodeAt(0) & 127) * 5;
    for (let i = 0; i < 6; i++) {
      const line = i < 5 ? D.font[o + i] : 0;
      for (let j = 0; j < 8; j++) {
        const xx = x + i, yy = y + j;
        if (xx >= 0 && xx < W && yy >= 0 && yy < 240) fb[yy * W + xx] = (line >> j) & 1 ? fg : bg;
      }
    }
    x += 6;
  }
}
const textC = (s, y, fg, bg) => text(s, (W - s.length * 6) >> 1, y, fg, bg);
// AprecID's DIN 1451 lines, four levels between the ground and the ink
function dinWidth(size, s) { let w = 0; for (const ch of s) w += D.din[size].g[ch][2]; return w; }
function din(size, s, x, y, fg, bg) {
  const f = D.din[size], y0 = y - f.cap;
  const col = [bg, mix3(bg, fg, 1), mix3(bg, fg, 2), fg];
  for (const ch of s) {
    const [w, gx, adv, lv] = f.g[ch];
    for (let r = 0; r < f.h; r++) for (let c = 0; c < w; c++) {
      const l = lv.charCodeAt(r * w + c) - 48;
      if (l) { const xx = x + gx + c, yy = y0 + r; if (xx >= 0 && xx < W && yy >= 0 && yy < 240) fb[yy * W + xx] = col[l]; }
    }
    x += adv;
  }
}

function bar() {
  fill(0, 0, W, TOP, T.bar);
  text("SCORE " + String(g.score).padStart(6, '0'), 2, 5, T.barText, T.bar);
  text("HI " + String(hi).padStart(6, '0'), 80, 5, T.barText, T.bar);
  for (let i = 0; i < Math.min(g.lives, 5); i++) {         // a small ship for each one left
    const x = 140 + i * 10;
    fill(x, 8, 9, 2, T.barHi); fill(x, 6, 2, 2, T.barHi); fill(x + 5, 7, 3, 1, T.barHi);
  }
  if (auto) text("AP", 194, 5, T.ok, T.bar);
  let lab = g.lab[0][1], best = 0;
  const at = g.scroll + (g.px >> 4);
  for (let i = 0; i < Math.min(4, g.labN); i++) if (g.lab[i][0] <= at && g.lab[i][0] >= best) { best = g.lab[i][0]; lab = g.lab[i][1]; }
  if (state === PAUSE) lab = "PAUSED";
  text(lab, 214, 5, state === PAUSE ? T.err : T.barHi, T.bar);
}

function title() {
  fill(0, 0, W, 240, T.bg);
  for (let x = 0; x < W; x++) {                              // a strip of signal under the name
    let y = 196 - cdiv(isin((x * 3) & 255) * 18, 127);
    if (((x / 40) | 0) & 1) y = (x % 40) < 20 ? 182 : 210;
    fill(x, y, 1, 2, T.trace);
    fill(x, y + 2, 1, 240 - y - 2, mix4(T.bg, T.trace, 1));
  }
  din('BIG', "WAVE RAID", (W - dinWidth('BIG', "WAVE RAID")) >> 1, 28, T.trace, T.bg);
  din('SMALL', "fly over the signal", (W - dinWidth('SMALL', "fly over the signal")) >> 1, 66, T.text2, T.bg);
  for (let i = 0; i < SHIP_H; i++) for (let j = 0; j < SHIP_W; j++) {   // the ship, twice its size
    const c = SHIP[i][j];
    if (c !== '.') fill(140 + j * 2, 93 + i * 2, 2, 2, INK[c] ?? T.ok);
  }
  if (touch) {
    textC("stick fly    FIRE fire    BOMB bomb", 118, T.muted, T.bg);
    textC("AUTO autopilot    PAUSE pause", 132, T.muted, T.bg);
  } else {
    textC("arrows fly    SPACE fire    B bomb", 118, T.muted, T.bg);
    textC("A autopilot    P pause    ESC title", 132, T.muted, T.bg);
  }
  textC("HI " + String(hi).padStart(6, '0'), 150, T.text, T.bg);
  textC(touch ? "FIRE to start" : "SPACE to start", 166, T.err, T.bg);
}
function over() {
  fill(70, 90, 180, 62, T.bar);
  fill(70, 90, 180, 1, T.barHi); fill(70, 151, 180, 1, T.barHi); fill(70, 90, 1, 62, T.barHi); fill(249, 90, 1, 62, T.barHi);
  din('SMALL', "GAME OVER", 160 - (dinWidth('SMALL', "GAME OVER") >> 1), 104, T.barHi, T.bar);
  text("SCORE " + String(g.score).padStart(6, '0'), 124, 124, T.barText, T.bar);
  textC(touch ? "FIRE again" : "SPACE again    ESC title", 138, T.barText, T.bar);
}

const cv = document.getElementById('scr'), cx2 = cv.getContext('2d');
const img = cx2.createImageData(W, 240), px32 = new Uint32Array(img.data.buffer);
function show() { for (let i = 0; i < fb.length; i++) px32[i] = LUT[fb[i]]; cx2.putImageData(img, 0, 0); }
function draw() {
  if (state === TITLE) title();
  else { render(); bar(); if (state === OVER) over(); }
  show();
}

// -- sound: the instrument's buzzer, square tones ----------------------
let ac = null, osc = null, sound = true;
function tone(f, ms) {
  if (!sound || !ac) return;
  try {
    if (osc) { try { osc.stop(); } catch (e) {} }
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = 'square'; o.frequency.value = f; gn.gain.value = 0.035;
    o.connect(gn).connect(ac.destination);
    const t0 = ac.currentTime; o.start(t0); o.stop(t0 + Math.max(ms, 15) / 1000);
    osc = o;
  } catch (e) {}
}
function wakeAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}

// -- keeping the theme, the sound and the best score in this browser -------
function save() { try { localStorage.setItem('waveraid', JSON.stringify({ theme: themeSel.value, sound, hi })); } catch (e) {} }
let saved = {};
try { saved = JSON.parse(localStorage.getItem('waveraid') || '{}') || {}; } catch (e) {}
hi = saved.hi | 0; sound = saved.sound !== false;

// -- the keys ----------------------------------------------------------
const held = { up: false, dn: false, lt: false, rt: false, fire: false };
const hits = { bomb: 0 };
let touch = matchMedia('(pointer: coarse)').matches;

function start() { reset(); state = PLAY; hits.bomb = 0; last = performance.now(); acc = 0; }
function action(k) {                     // a key or a button pressed
  wakeAudio();
  if (k === 'title') { if (state !== TITLE) { state = TITLE; draw(); } return; }
  if (state === TITLE || state === OVER) { if (k === 'fire' || k === 'bomb' || k === 'start') start(); return; }
  if (k === 'pause') {
    if (state === PAUSE) state = pausedFrom; else { pausedFrom = state; state = PAUSE; }
    draw(); last = performance.now(); return;
  }
  if (state === PAUSE) return;
  if (k === 'auto') { if (state === PLAY) auto = !auto; return; }
  if (k === 'bomb') hits.bomb++;
}
let pausedFrom = PLAY;
const KEYS = { ArrowUp: 'up', ArrowDown: 'dn', ArrowLeft: 'lt', ArrowRight: 'rt', ' ': 'fire', x: 'fire', X: 'fire', Control: 'fire',
  b: 'bomb', B: 'bomb', z: 'bomb', Z: 'bomb', Enter: 'bomb', a: 'auto', A: 'auto', p: 'pause', P: 'pause', Escape: 'title' };
addEventListener('keydown', e => {
  const k = KEYS[e.key];
  if (!k || e.altKey || e.metaKey) return;
  e.preventDefault();
  if (touch) { touch = false; document.body.classList.remove('touch'); fit(); if (state === TITLE) draw(); }
  if (k in held) { if (!held[k] && k === 'fire') action('fire'); held[k] = true; }
  else if (!e.repeat) action(k);
});
addEventListener('keyup', e => { const k = KEYS[e.key]; if (k in held) held[k] = false; });
addEventListener('blur', () => { for (const k in held) held[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && (state === PLAY || state === DEAD)) action('pause'); });

// the stick: where the finger is from its middle says which arrows are held
const stick = document.getElementById('stick'), knob = document.getElementById('knob');
let stickId = null;
function stickAt(e) {
  const r = stick.getBoundingClientRect(), R = r.width / 2;
  let dx = e.clientX - r.left - R, dy = e.clientY - r.top - R;
  const d = Math.hypot(dx, dy), lim = R - 20;
  const dead = R * 0.28;
  held.lt = dx < -dead; held.rt = dx > dead; held.up = dy < -dead; held.dn = dy > dead;
  if (d > lim) { dx *= lim / d; dy *= lim / d; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  stick.querySelector('.u').classList.toggle('on', held.up); stick.querySelector('.d').classList.toggle('on', held.dn);
  stick.querySelector('.l').classList.toggle('on', held.lt); stick.querySelector('.r').classList.toggle('on', held.rt);
}
function stickOff() {
  stickId = null; held.up = held.dn = held.lt = held.rt = false; knob.style.transform = '';
  stick.querySelectorAll('i').forEach(i => i.classList.remove('on'));
}
stick.addEventListener('pointerdown', e => { e.preventDefault(); wakeAudio(); stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickAt(e); });
stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickAt(e); });
stick.addEventListener('pointerup', e => { if (e.pointerId === stickId) stickOff(); });
stick.addEventListener('pointercancel', e => { if (e.pointerId === stickId) stickOff(); });
document.querySelectorAll('#btns div').forEach(el => {
  const k = el.dataset.k;
  const off = () => { el.classList.remove('on'); if (k === 'fire') held.fire = false; };
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('on');
    if (k === 'fire') held.fire = true;
    action(k);
  });
  el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off);
});
cv.addEventListener('pointerdown', () => { if (state === TITLE || state === OVER) action('start'); });
addEventListener('touchstart', () => { if (!touch) { touch = true; document.body.classList.add('touch'); fit(); if (state === TITLE) draw(); } }, { passive: true });
addEventListener('contextmenu', e => e.preventDefault());

// -- the size: whole device pixels for each of the instrument's ------------
function fit() {
  document.body.classList.toggle('touch', touch);
  const port = touch && innerHeight > innerWidth;
  document.body.classList.toggle('port', port);
  const dpr = devicePixelRatio || 1;
  let aw = innerWidth - 32, ah = innerHeight - (touch ? 30 : 70);
  if (touch && port) ah -= 190;
  if (touch && !port) aw -= 2 * (132 + 18) + 10;
  let k = Math.min(aw / 320, ah / 240);
  const kk = Math.floor(k * dpr) / dpr;
  if (kk >= 1) k = kk;
  cv.style.width = Math.round(320 * k) + 'px'; cv.style.height = Math.round(240 * k) + 'px';
}
addEventListener('resize', fit);

// -- the controls under the picture -----------------------------------------
const themeSel = document.getElementById('theme'), soundBox = document.getElementById('sound');
D.themes.forEach((t, i) => themeSel.add(new Option(t[0], i)));
themeSel.value = saved.theme != null && D.themes[saved.theme] ? saved.theme : 0;
themeSel.addEventListener('change', () => { setTheme(+themeSel.value); save(); draw(); themeSel.blur(); });
soundBox.checked = sound;
soundBox.addEventListener('change', () => { sound = soundBox.checked; save(); soundBox.blur(); wakeAudio(); });

// -- the loop: 30 frames a second, as on the instrument -------------------
let last = performance.now(), acc = 0;
function loop(now) {
  if (state === PLAY || state === DEAD) {
    acc += Math.min(now - last, 100);
    let n = 0;
    while (acc >= FRAME_MS && n < 2) { acc -= FRAME_MS; step(); n++; }
    if (acc >= FRAME_MS) acc = 0;
    if (n) draw();
  }
  last = now;
  requestAnimationFrame(loop);
}
setTheme(+themeSel.value);
reset();
fit();
draw();
requestAnimationFrame(loop);
</script>
</body>
</html>
